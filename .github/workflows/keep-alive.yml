name: Keep Alive

on:
  schedule:
    # 每天 UTC 00:00 运行一次
    - cron: '0 8 * * *'          # 这里直接写8点
      timezone: "Asia/Shanghai"  # 明确指定时区为北京时间
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      # 需要写入权限才能推送提交
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v1  # 使用社区保活Action
